[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wardrobe-ai"
version = "0.1.0"
description = "Personal wardrobe and outfit generation backend prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wardrobe_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
